name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DemoSolution.slnx

      - name: Build
        run: dotnet build DemoSolution.slnx --no-restore --configuration Release

      - name: Test (unit + integration)
        run: dotnet test DemoSolution.slnx --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Fail on vulnerable packages
        run: |
          dotnet list DemoSolution.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
